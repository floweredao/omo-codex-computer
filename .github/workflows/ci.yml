name: CI

# Automatic triggers disabled (no GitHub Actions authorization); run manually
# via workflow_dispatch when needed. Re-enable push/pull_request to restore CI.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Bun check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run check
